<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="UNIS WMS Daily Facility Workload Overview">
<title>Daily Facility Workload Overview - Valley View</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12;
    --surface: #161920;
    --surface2: #1e222b;
    --border: #272c38;
    --border2: #323848;
    --text: #e4e8f0;
    --text2: #8b92a4;
    --text3: #4e5566;
    --accent: #4a9eff;
    --accent2: #1c4f8f;
    --green: #2fd87c;
    --green-bg: rgba(47,216,124,0.08);
    --yellow: #f5c242;
    --yellow-bg: rgba(245,194,66,0.08);
    --red: #f05a5a;
    --red-bg: rgba(240,90,90,0.08);
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74,158,255,0.06) 0%, transparent 70%), var(--bg);
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }
  .login-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .login-logo img { height: 26px; filter: brightness(0) invert(1); opacity: 0.9; }
  .login-badge {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .login-card h2 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .login-card p {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 28px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 11px 13px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 12px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 8px;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .login-hint {
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    margin-top: 16px;
  }
  .login-error {
    background: var(--red-bg);
    border: 1px solid rgba(240,90,90,0.25);
    border-radius: 7px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--red);
    margin-bottom: 16px;
    display: none;
  }

  /* ── DASHBOARD ── */
  #dashboard { display: none; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-left img { height: 22px; filter: brightness(0) invert(1); opacity: 0.85; }
  .breadcrumb {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text3);
  }
  .breadcrumb span { color: var(--text2); }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .date-pill {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
  }
  .btn-refresh {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    padding: 7px 14px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
  .btn-signout {
    background: none;
    border: none;
    color: var(--text3);
    font-size: 12px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .btn-signout:hover { color: var(--red); }

  .main-content { padding: 28px 24px; max-width: 1400px; margin: 0 auto; }

  /* date picker row */
  .date-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .date-row label { font-size: 12px; color: var(--text2); }
  .date-row input[type="date"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: 7px 12px;
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  .date-row input[type="date"]:focus { border-color: var(--accent); }
  .btn-load {
    background: var(--accent2);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 7px;
    padding: 7px 16px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-load:hover { background: var(--accent); color: #fff; }

  /* ── BAY TABS ── */
  .bay-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  .bay-tab {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text3);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 18px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    margin-bottom: -1px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .bay-tab:hover { color: var(--text2); }
  .bay-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* facility summary bar */
  .facility-summary {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 28px;
  }
  .fac-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .fac-card:hover { border-color: var(--border2); }
  .fac-card.active { border-color: var(--accent); background: rgba(74,158,255,0.05); }
  .fac-card .fc-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .fac-card .fc-acc {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    line-height: 1;
  }
  .fac-card .fc-sub {
    font-size: 10px;
    color: var(--text3);
    margin-top: 4px;
  }
  .fac-card.green .fc-acc { color: var(--green); }
  .fac-card.yellow .fc-acc { color: var(--yellow); }
  .fac-card.red .fc-acc { color: var(--red); }
  .fac-card.muted .fc-acc { color: var(--text3); }

  /* summary cards */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .summary-card .sc-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .summary-card .sc-val {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .summary-card .sc-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 5px;
  }
  .summary-card.green { border-color: rgba(47,216,124,0.3); }
  .summary-card.green .sc-val { color: var(--green); }
  .summary-card.yellow { border-color: rgba(245,194,66,0.3); }
  .summary-card.yellow .sc-val { color: var(--yellow); }
  .summary-card.red { border-color: rgba(240,90,90,0.3); }
  .summary-card.red .sc-val { color: var(--red); }

  /* section headers */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-header h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--text3);
  }

  /* main table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--surface2);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    padding: 11px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  thead th:not(:first-child) { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody td {
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text);
  }
  tbody td:not(:first-child) {
    font-family: var(--mono);
    text-align: right;
    font-size: 12px;
  }
  .customer-name { font-weight: 500; }
  .location-type {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* accuracy bar */
  .acc-cell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .acc-bar-wrap { width: 60px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .acc-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .acc-num { font-family: var(--mono); font-size: 12px; min-width: 40px; text-align: right; }

  /* totals row */
  tr.totals-row td {
    background: var(--surface2);
    font-weight: 600;
    border-top: 2px solid var(--border2);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
  }
  tr.totals-row td:first-child { color: var(--text2); font-family: var(--sans); font-size: 12px; }

  /* ticket list */
  .ticket-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .ticket-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ticket-top { display: flex; align-items: center; justify-content: space-between; }
  .ticket-id { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .ticket-status-pill {
    font-size: 10px;
    font-family: var(--mono);
    border-radius: 4px;
    padding: 2px 7px;
    text-transform: uppercase;
  }
  .status-completed { background: var(--green-bg); color: var(--green); border: 1px solid rgba(47,216,124,0.3); }
  .status-in_progress { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(245,194,66,0.3); }
  .status-open { background: rgba(74,158,255,0.08); color: var(--accent); border: 1px solid rgba(74,158,255,0.3); }
  .status-cancelled { background: rgba(139,146,164,0.08); color: var(--text3); border: 1px solid var(--border); }
  .ticket-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .ticket-meta-item { display: flex; flex-direction: column; gap: 2px; }
  .ticket-meta-label { font-size: 10px; color: var(--text3); }
  .ticket-meta-val { font-family: var(--mono); font-size: 12px; color: var(--text); }

  /* loading/empty */
  .loading-state, .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    gap: 12px;
    color: var(--text3);
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-state p, .empty-state p { font-size: 13px; color: var(--text3); }

  .section-divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

  /* bay panel */
  .bay-panel { display: none; }
  .bay-panel.active { display: block; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <img src="https://unisco.sfo3.digitaloceanspaces.com/design-unisco-com/svg/unis-logo.svg" alt="UNIS">
      <span class="login-badge">Warehouse dashboard</span>
    </div>
    <h2>Daily Facility Workload Overview</h2>
    <p>Valley View is selected by default when available on your account.</p>
    <div id="login-error" class="login-error"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="">
    </div>
    <button class="btn-primary" id="signin-btn" onclick="doLogin()">Sign in</button>
    <p class="login-hint">Access restricted to authorized UNIS personnel</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <img src="https://unisco.sfo3.digitaloceanspaces.com/design-unisco-com/svg/unis-logo.svg" alt="UNIS">
      <div class="breadcrumb">Valley View / <span>Daily Facility Workload Overview</span></div>
    </div>
    <div class="topbar-right">
      <div class="date-pill" id="topbar-date">—</div>
      <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
      <button class="btn-signout" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="main-content">
    <!-- Date selector -->
    <div class="date-row">
      <label>Report date:</label>
      <input type="date" id="report-date">
      <button class="btn-load" onclick="loadData()">Load</button>
    </div>

    <!-- Facility-wide summary bar -->
    <div class="facility-summary" id="facility-summary">
      <!-- populated by JS -->
    </div>

    <!-- Bay tabs -->
    <div class="bay-tabs" id="bay-tabs">
      <button class="bay-tab active" data-bay="0" onclick="switchBay(0)">Bay 1</button>
      <button class="bay-tab" data-bay="1" onclick="switchBay(1)">Bay 2</button>
      <button class="bay-tab" data-bay="2" onclick="switchBay(2)">Cold Room</button>
      <button class="bay-tab" data-bay="3" onclick="switchBay(3)">Bay 3</button>
      <button class="bay-tab" data-bay="4" onclick="switchBay(4)">Bay 4</button>
      <button class="bay-tab" data-bay="5" onclick="switchBay(5)">Bay 5</button>
    </div>

    <!-- Per-bay panels (1–5) -->
    <!-- These are generated by JS -->
    <div id="bay-panels"></div>
  </div>
</div>

<script>
// ═══════════════ CONFIG ═══════════════
const AUTH_URL    = 'https://atlas.item.com/api/auth/password-grant';
const CC_BASE     = 'https://cyclecount.item.com';
const FACILITY_ID = 'LT_F1';
const TENANT_ID   = 'LT';

// ── Bay location definitions ─────────────────────────────────────────────────
// Racking: SECTION.BAY.ROW.SLOT (4-part), e.g. 116.024.1.1
// Bulk:    SECTION.SLOT (2-part), e.g. 51.057
// Cold Room is treated as its own bay (racking 205-223, bulk sec 51 slots 6-49 & sec 1 slots 106-150)
// Bay 2 racking excludes Cold Room range (205-223); handled by COLD ROOM check first.

const BAY_DEFS = [
  // Order matters for overlap resolution — COLD ROOM must come before BAY 2
  {
    label: 'COLD ROOM',
    rack: [{ min: 205, max: 223 }],
    bulk: [
      { section: 51, slotMin: 6,   slotMax: 49  },
      { section: 1,  slotMin: 106, slotMax: 150 }
    ]
  },
  {
    label: 'BAY 1',
    rack: [{ min: 100, max: 199 }],
    bulk: []
  },
  {
    label: 'BAY 2',
    rack: [{ min: 200, max: 299 }],   // Cold Room (205-223) already matched above
    bulk: [
      { section: 51, slotMin: 57,  slotMax: 90  },
      { section: 15, slotMin: 98,  slotMax: 150 }
    ]
  },
  {
    label: 'BAY 3',
    rack: [{ min: 300, max: 399 }],
    bulk: [
      { section: 10, slotMin: 6,  slotMax: 200 },
      { section: 11, slotMin: 6,  slotMax: 200 },
      { section: 12, slotMin: 6,  slotMax: 200 },
      { section: 13, slotMin: 6,  slotMax: 200 },
      { section: 14, slotMin: 6,  slotMax: 200 },
      { section: 15, slotMin: 6,  slotMax: 70  },
      { section: 50, slotMin: 52, slotMax: 94  }
    ]
  },
  {
    label: 'BAY 4',
    rack: [{ min: 4103, max: 4145 }],
    bulk: [
      { section: 19, slotMin: 6, slotMax: 104 },
      { section: 20, slotMin: 6, slotMax: 104 },
      { section: 21, slotMin: 6, slotMax: 104 },
      { section: 22, slotMin: 6, slotMax: 104 },
      { section: 23, slotMin: 6, slotMax: 104 },
      { section: 24, slotMin: 6, slotMax: 104 }
    ]
  },
  {
    label: 'BAY 5',
    rack: [{ min: 500, max: 599 }],
    bulk: []
  }
];

let TOKEN        = '';
let activeBay    = 0;
let cachedData   = null; // { tickets, results, customerMap, dateStr }

// ═══════════════ AUTH ═══════════════
async function doLogin() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value;
  const btn  = document.getElementById('signin-btn');
  const err  = document.getElementById('login-error');
  if (!user || !pass) { showLoginError('Please enter username and password.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…'; err.style.display = 'none';
  try {
    const res  = await fetch(AUTH_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data  = await res.json();
    const token = data?.data?.accessToken || data?.accessToken || data?.token;
    if (!token) throw new Error(data?.message || data?.error || 'Login failed');
    TOKEN = token;
    sessionStorage.setItem('vv_token', token);
    showDashboard();
  } catch(e) {
    showLoginError(e.message || 'Login failed. Check your credentials.');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}
function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block';
}
function signOut() {
  TOKEN = ''; cachedData = null;
  sessionStorage.removeItem('vv_token');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('signin-btn').disabled = false;
  document.getElementById('signin-btn').textContent = 'Sign in';
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

// ═══════════════ API HELPERS ═══════════════
function ccHeaders() {
  return {
    'Authorization': `Bearer ${TOKEN}`,
    'Content-Type': 'application/json',
    'x-tenant-id': TENANT_ID,
    'x-facility-id': FACILITY_ID,
    'x-channel': 'WEB',
    'item-screen-id': 'countTicket',
    'item-time-zone': 'America/Los_Angeles',
    'origin': 'https://cyclecount.item.com',
    'referer': 'https://cyclecount.item.com/cycle-count/count-ticket',
    'accept': 'application/json, text/plain, */*',
  };
}
async function ccPost(path, body) {
  const r = await fetch(`${CC_BASE}/api${path}`, {
    method: 'POST', headers: ccHeaders(), body: JSON.stringify(body)
  });
  if (!r.ok) { const t = await r.text(); throw new Error(`${path} → ${r.status}: ${t}`); }
  return r.json();
}
async function fetchAllPages(path, body) {
  let page = 1, all = [];
  while (true) {
    const data = await ccPost(path, { ...body, page, pageSize: 100 });
    const rows = data?.data?.list || data?.data?.content || data?.list || data?.content || [];
    all = all.concat(rows);
    const total = data?.data?.total ?? data?.total ?? rows.length;
    if (all.length >= total || rows.length === 0) break;
    page++;
  }
  return all;
}

// Bay index matches BAY_DEFS array order: 0=Cold Room,1=Bay1,2=Bay2,3=Bay3,4=Bay4,5=Bay5

function showDashboard() {

      </div>

function switchBay(idx) {

  document.querySelectorAll('.bay-tab').forEach(t => t.classList.toggle('active', parseInt(t.dataset.bay) === idx));
  document.querySelectorAll('.bay-panel').forEach(p => p.classList.toggle('active', p.id === `bay-panel-${idx}`));
  document.querySelectorAll('.fac-card').forEach(c => c.classList.toggle('active', parseInt(c.dataset.bay) === idx));
}

// ═══════════════ DATA FETCHING ═══════════════
async function loadData() {
  const dateStr = document.getElementById('report-date').value;
  if (!dateStr) return;
  document.getElementById('topbar-date').textContent = dateStr;

  // Reset all panels to loading
  BAY_DEFS.forEach((def, i) => {
    document.getElementById(`summary-grid-${i}`).innerHTML   = loadingHTML('Loading summary…');
    document.getElementById(`table-wrap-${i}`).innerHTML     = loadingHTML('Fetching cycle count data…');
    document.getElementById(`ticket-list-${i}`).innerHTML    = loadingHTML('Loading tickets…');
    document.getElementById(`table-date-tag-${i}`).textContent = dateStr;
    document.getElementById(`ticket-count-tag-${i}`).textContent = '…';
  });
  document.getElementById('facility-summary').innerHTML = BAY_DEFS.map((def, i) =>
    `<div class="fac-card muted ${i === activeBay ? 'active' : ''}" data-bay="${i}" onclick="switchBay(${i})">
       <div class="fc-label">${def.label}</div>
       <div class="fc-acc">—</div>
       <div class="fc-sub">loading…</div>
     </div>`
  ).join('');

  try {
    const [tickets, results, customerMap] = await Promise.all([
      fetchTickets(dateStr), fetchResults(dateStr), fetchCustomers()
    ]);
    cachedData = { tickets, results, customerMap, dateStr };
    renderAll(tickets, results, customerMap, dateStr);
  } catch(e) {
    const msg = `<div class="loading-state"><p>⚠ ${e.message}</p></div>`;
    BAY_DEFS.forEach((def, i) => {
      document.getElementById(`summary-grid-${i}`).innerHTML = msg;
      document.getElementById(`table-wrap-${i}`).innerHTML   = msg;
      document.getElementById(`ticket-list-${i}`).innerHTML  = msg;
    });
    console.error(e);
  }
}

async function fetchTickets(dateStr) {
  return fetchAllPages('/cyclecount-app/cycle-count/count-ticket/search-by-paging', {
    createdTimeFrom: `${dateStr}T00:00:00`,
    createdTimeTo:   `${dateStr}T23:59:59`,
  });
}
async function fetchResults(dateStr) {
  return fetchAllPages('/cyclecount-app/cycle-count/count-result/search-by-paging', {
    createdTimeFrom: `${dateStr}T00:00:00`,
    createdTimeTo:   `${dateStr}T23:59:59`,
  });
}
async function fetchCustomers() {
  try {
    const data = await ccPost('/cyclecount-bam/wms-bam/organization/search-by-paging', {
      page: 1, pageSize: 200, organizationType: 'CUSTOMER'
    });
    const list = data?.data?.list || data?.data?.content || data?.list || [];
    const map  = {};
    list.forEach(c => { map[c.id] = c.name || c.organizationName || c.id; });
    return map;
  } catch(e) {
    console.warn('Could not load customers:', e.message);
    return {};
  }
}

// ═══════════════ BAY LOCATION DETECTION ═══════════════
// Returns index into BAY_DEFS array, or null if unmatched.
// Order in BAY_DEFS matters: COLD ROOM (index 0) is checked before BAY 2 (index 2).
function getBayForLocation(locCode) {
  if (!locCode) return null;
  const parts = locCode.split('.');
  if (parts.length < 2) return null;
  const section = parseInt(parts[0]);
  const slot    = parseInt(parts[1]);

  for (let i = 0; i < BAY_DEFS.length; i++) {
    const def = BAY_DEFS[i];
    // Bulk check first (low section numbers, 2-part codes)
    for (const b of def.bulk) {
      if (section === b.section && slot >= b.slotMin && slot <= b.slotMax) return i;
    }
    // Racking check (4-part codes, section in range)
    if (parts.length >= 4) {
      for (const r of def.rack) {
        if (section >= r.min && section <= r.max) return i;
      }
    }
  }
  return null;
}

function locationType(locCode) {
  if (!locCode) return 'UNKNOWN';
  const parts   = locCode.split('.');
  const section = parseInt(parts[0]);
  // Racking = 4-part code
  if (parts.length >= 4) {
    for (const def of BAY_DEFS) {
      for (const r of def.rack) {
        if (section >= r.min && section <= r.max) return 'RACKING';
      }
    }
  }
  return 'BULK';
}

// ═══════════════ RENDER ALL BAYS ═══════════════
function renderAll(tickets, results, customerMap, dateStr) {
  const n = BAY_DEFS.length;
  // Group results by bay index
  const resultsByBay = Array.from({length: n}, () => []);
  results.forEach(r => {
    const loc = r.locationCode || r.location?.code || r.location || '';
    const idx = getBayForLocation(loc);
    if (idx !== null) resultsByBay[idx].push(r);
  });

  // Group tickets by bay index
  const ticketIdsByBay = Array.from({length: n}, () => new Set());
  results.forEach(r => {
    const loc = r.locationCode || r.location?.code || r.location || '';
    const idx = getBayForLocation(loc);
    if (idx !== null) ticketIdsByBay[idx].add(r.countTicketId || r.ticketId);
  });

  const facilityCards = [];

  BAY_DEFS.forEach((def, b) => {
    const bayResults  = resultsByBay[b];
    const bayTickets  = tickets.filter(t => ticketIdsByBay[b].has(t.id));

    // Aggregate by customer
    const byCustomer = {};
    bayResults.forEach(r => {
      const cid   = r.customerId || r.customer?.id || 'UNKNOWN';
      const cname = customerMap[cid] || r.customerName || r.customer?.name || cid;
      const loc   = r.locationCode || r.location?.code || r.location || '';
      const ltype = locationType(loc);
      if (!byCustomer[cid]) byCustomer[cid] = { id: cid, name: cname, total: 0, accurate: 0, variances: 0, racking: 0, bulk: 0 };
      byCustomer[cid].total++;
      const counted  = r.countedQuantity  ?? r.countedQty  ?? r.qty ?? null;
      const expected = r.expectedQuantity ?? r.expectedQty ?? r.systemQty ?? null;
      if (counted !== null && expected !== null) {
        if (counted === expected) byCustomer[cid].accurate++;
        else byCustomer[cid].variances++;
      }
      if (ltype === 'RACKING') byCustomer[cid].racking++;
      else byCustomer[cid].bulk++;
    });

    const rows         = Object.values(byCustomer).sort((a,z) => z.total - a.total);
    const totalLoc     = bayResults.length;
    const totalAcc     = rows.reduce((s,r) => s + r.accurate, 0);
    const totalVar     = rows.reduce((s,r) => s + r.variances, 0);
    const accuracy     = totalLoc > 0 ? Math.round((totalAcc / totalLoc) * 100) : null;

    renderBaySummary(b, totalLoc, totalAcc, totalVar, accuracy, bayTickets.length, dateStr);
    renderBayTable(b, rows, totalLoc, totalAcc, totalVar);
    renderBayTickets(b, bayTickets, customerMap);

    facilityCards.push({ idx: b, label: def.label, accuracy, totalLoc, totalVar });
  });

  renderFacilitySummary(facilityCards);
}

function renderFacilitySummary(cards) {
  document.getElementById('facility-summary').innerHTML = cards.map(c => {
    const acc = c.accuracy;
    const cls = acc === null ? 'muted' : acc >= 95 ? 'green' : acc >= 85 ? 'yellow' : 'red';
    return `<div class="fac-card ${cls} ${c.idx === activeBay ? 'active' : ''}" data-bay="${c.idx}" onclick="switchBay(${c.idx})">
      <div class="fc-label">${c.label}</div>
      <div class="fc-acc">${acc !== null ? acc + '%' : '—'}</div>
      <div class="fc-sub">${c.totalLoc.toLocaleString()} locations${c.totalVar > 0 ? ' · ' + c.totalVar + ' var' : ''}</div>
    </div>`;
  }).join('');
}

function renderBaySummary(bay, total, accurate, variances, accuracy, ticketCount, dateStr) {
  const color = accuracy === null ? '' : accuracy >= 95 ? 'green' : accuracy >= 85 ? 'yellow' : 'red';
  const bayLabel = BAY_DEFS[bay]?.label || `Bay ${bay}`;
  document.getElementById(`summary-grid-${bay}`).innerHTML = `
    <div class="summary-card">
      <div class="sc-label">Locations Counted</div>
      <div class="sc-val">${total.toLocaleString()}</div>
      <div class="sc-sub">${bayLabel}</div>
    </div>
    <div class="summary-card ${color}">
      <div class="sc-label">Accuracy</div>
      <div class="sc-val">${accuracy !== null ? accuracy + '%' : '—'}</div>
      <div class="sc-sub">${accurate.toLocaleString()} exact matches</div>
    </div>
    <div class="summary-card ${variances > 0 ? 'red' : ''}">
      <div class="sc-label">Variances</div>
      <div class="sc-val">${variances.toLocaleString()}</div>
      <div class="sc-sub">locations with discrepancy</div>
    </div>
    <div class="summary-card">
      <div class="sc-label">Tickets</div>
      <div class="sc-val">${ticketCount}</div>
      <div class="sc-sub">count tickets today</div>
    </div>
  `;
  document.getElementById(`ticket-count-tag-${bay}`).textContent = `${ticketCount} ticket${ticketCount !== 1 ? 's' : ''}`;
}

function renderBayTable(bay, rows, totalLoc, totalAcc, totalVar) {
  if (!rows.length) {
    document.getElementById(`table-wrap-${bay}`).innerHTML =
      `<div class="empty-state"><p>No ${BAY_DEFS[bay]?.label || "Bay "+bay} cycle count data found for this date.</p></div>`;
    return;
  }
  const rowsHtml = rows.map(r => {
    const pct   = r.total > 0 ? Math.round((r.accurate / r.total) * 100) : 0;
    const color = pct >= 95 ? 'var(--green)' : pct >= 85 ? 'var(--yellow)' : 'var(--red)';
    return `<tr>
      <td>
        <div class="customer-name">${esc(r.name)}</div>
        <div class="location-type">
          ${r.racking > 0 ? `RACK: ${r.racking}` : ''}
          ${r.racking > 0 && r.bulk > 0 ? ' · ' : ''}
          ${r.bulk > 0 ? `BULK: ${r.bulk}` : ''}
        </div>
      </td>
      <td>${r.total.toLocaleString()}</td>
      <td>${r.accurate.toLocaleString()}</td>
      <td>${r.variances > 0 ? `<span style="color:var(--red)">${r.variances.toLocaleString()}</span>` : '—'}</td>
      <td>
        <div class="acc-cell">
          <div class="acc-bar-wrap"><div class="acc-bar" style="width:${pct}%;background:${color}"></div></div>
          <span class="acc-num" style="color:${color}">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');
  const totalPct = totalLoc > 0 ? Math.round((totalAcc / totalLoc) * 100) : 0;
  document.getElementById(`table-wrap-${bay}`).innerHTML = `
    <table>
      <thead><tr>
        <th>Customer</th><th>Locations</th><th>Accurate</th><th>Variances</th><th>Accuracy</th>
      </tr></thead>
      <tbody>
        ${rowsHtml}
        <tr class="totals-row">
          <td>TOTAL — ${BAY_DEFS[bay]?.label || 'Bay '+bay}</td>
          <td>${totalLoc.toLocaleString()}</td>
          <td>${totalAcc.toLocaleString()}</td>
          <td>${totalVar > 0 ? totalVar.toLocaleString() : '—'}</td>
          <td><span style="font-family:var(--mono)">${totalPct}%</span></td>
        </tr>
      </tbody>
    </table>`;
}

function renderBayTickets(bay, tickets, customerMap) {
  if (!tickets.length) {
    document.getElementById(`ticket-list-${bay}`).innerHTML =
      `<div class="empty-state"><p>No ${BAY_DEFS[bay]?.label || "Bay "+bay} tickets found for this date.</p></div>`;
    return;
  }
  const sorted = [...tickets].sort((a,b) => {
    const order = { COMPLETED:0, IN_PROGRESS:1, OPEN:2, CANCELLED:3 };
    return (order[a.status]??9) - (order[b.status]??9);
  });
  const cards = sorted.map(t => {
    const status    = t.status || 'UNKNOWN';
    const statusCls = 'status-' + status.toLowerCase().replace(/ /g,'_');
    const cid       = t.customerId || t.customer?.id;
    const cname     = customerMap[cid] || t.customerName || t.customer?.name || cid || '—';
    const ticketNo  = t.ticketNo || t.countTicketNo || t.no || t.id || '—';
    const created   = t.createdTime ? t.createdTime.slice(0,16).replace('T',' ') : '—';
    const type      = t.countType || t.type || '—';
    const method    = t.countMethod || t.method || '—';
    return `<div class="ticket-card">
      <div class="ticket-top">
        <span class="ticket-id">${esc(String(ticketNo))}</span>
        <span class="ticket-status-pill ${statusCls}">${status.replace(/_/g,' ')}</span>
      </div>
      <div class="ticket-meta">
        <div class="ticket-meta-item"><span class="ticket-meta-label">Customer</span><span class="ticket-meta-val">${esc(String(cname))}</span></div>
        <div class="ticket-meta-item"><span class="ticket-meta-label">Created</span><span class="ticket-meta-val">${created}</span></div>
        <div class="ticket-meta-item"><span class="ticket-meta-label">Type</span><span class="ticket-meta-val">${esc(String(type))}</span></div>
        <div class="ticket-meta-item"><span class="ticket-meta-label">Method</span><span class="ticket-meta-val">${esc(String(method))}</span></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById(`ticket-list-${bay}`).innerHTML = `<div class="ticket-grid">${cards}</div>`;
}

// ═══════════════ UTILITIES ═══════════════
function loadingHTML(msg) {
  return `<div class="loading-state"><div class="spinner"></div><p>${msg}</p></div>`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
