<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="UNIS WMS Bay 4 operational dashboard">
<title>Bay 4 Report - Valley View</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12;
    --surface: #161920;
    --surface2: #1e222b;
    --border: #272c38;
    --border2: #323848;
    --text: #e4e8f0;
    --text2: #8b92a4;
    --text3: #4e5566;
    --accent: #4a9eff;
    --accent2: #1c4f8f;
    --green: #2fd87c;
    --green-bg: rgba(47,216,124,0.08);
    --yellow: #f5c242;
    --yellow-bg: rgba(245,194,66,0.08);
    --red: #f05a5a;
    --red-bg: rgba(240,90,90,0.08);
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74,158,255,0.06) 0%, transparent 70%), var(--bg);
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  }
  .login-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .login-logo img { height: 26px; filter: brightness(0) invert(1); opacity: 0.9; }
  .login-badge {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .login-card h2 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .login-card p {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 28px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 7px;
  }
  .field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 11px 13px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 12px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 8px;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .login-hint {
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    margin-top: 16px;
  }
  .login-error {
    background: var(--red-bg);
    border: 1px solid rgba(240,90,90,0.25);
    border-radius: 7px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--red);
    margin-bottom: 16px;
    display: none;
  }

  /* ── DASHBOARD ── */
  #dashboard { display: none; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-left img { height: 22px; filter: brightness(0) invert(1); opacity: 0.85; }
  .breadcrumb {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text3);
  }
  .breadcrumb span { color: var(--text2); }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .date-pill {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
  }
  .btn-refresh {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    padding: 7px 14px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
  .btn-signout {
    background: none;
    border: none;
    color: var(--text3);
    font-size: 12px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .btn-signout:hover { color: var(--red); }

  .main-content { padding: 28px 24px; max-width: 1400px; margin: 0 auto; }

  /* date picker row */
  .date-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .date-row label { font-size: 12px; color: var(--text2); }
  .date-row input[type="date"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: 7px 12px;
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  .date-row input[type="date"]:focus { border-color: var(--accent); }
  .btn-load {
    background: var(--accent2);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 7px;
    padding: 7px 16px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-load:hover { background: var(--accent); color: #fff; }

  /* summary cards */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .summary-card .sc-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .summary-card .sc-val {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .summary-card .sc-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 5px;
  }
  .summary-card.green { border-color: rgba(47,216,124,0.3); }
  .summary-card.green .sc-val { color: var(--green); }
  .summary-card.yellow { border-color: rgba(245,194,66,0.3); }
  .summary-card.yellow .sc-val { color: var(--yellow); }
  .summary-card.red { border-color: rgba(240,90,90,0.3); }
  .summary-card.red .sc-val { color: var(--red); }

  /* section headers */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-header h3 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--text3);
  }

  /* main table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--surface2);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    padding: 11px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  thead th:not(:first-child) { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody td {
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text);
  }
  tbody td:not(:first-child) {
    font-family: var(--mono);
    text-align: right;
    font-size: 12px;
  }
  .customer-name { font-weight: 500; }
  .location-type { 
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* accuracy bar */
  .acc-cell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .acc-bar-wrap { width: 60px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .acc-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .acc-num { font-family: var(--mono); font-size: 12px; min-width: 40px; text-align: right; }

  /* totals row */
  tr.totals-row td {
    background: var(--surface2);
    font-weight: 600;
    border-top: 2px solid var(--border2);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
  }
  tr.totals-row td:first-child { color: var(--text2); font-family: var(--sans); font-size: 12px; }

  /* ticket list */
  .ticket-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .ticket-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ticket-top { display: flex; align-items: center; justify-content: space-between; }
  .ticket-id { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .ticket-status-pill {
    font-size: 10px;
    font-family: var(--mono);
    border-radius: 4px;
    padding: 2px 7px;
    text-transform: uppercase;
  }
  .status-completed { background: var(--green-bg); color: var(--green); border: 1px solid rgba(47,216,124,0.3); }
  .status-in_progress { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(245,194,66,0.3); }
  .status-open { background: rgba(74,158,255,0.08); color: var(--accent); border: 1px solid rgba(74,158,255,0.3); }
  .status-cancelled { background: rgba(139,146,164,0.08); color: var(--text3); border: 1px solid var(--border); }
  .ticket-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .ticket-meta-item { display: flex; flex-direction: column; gap: 2px; }
  .ticket-meta-label { font-size: 10px; color: var(--text3); }
  .ticket-meta-val { font-family: var(--mono); font-size: 12px; color: var(--text); }

  /* loading/empty */
  .loading-state, .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    gap: 12px;
    color: var(--text3);
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-state p, .empty-state p { font-size: 13px; color: var(--text3); }

  /* progress bars */
  .progress-wrap { width: 80px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .progress-fill { height: 100%; border-radius: 2px; }

  .section-divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
</style>
</head>
<body>

<!-- ═══════════════════════════════ LOGIN ═══════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <img src="https://unisco.sfo3.digitaloceanspaces.com/design-unisco-com/svg/unis-logo.svg" alt="UNIS">
      <span class="login-badge">Warehouse dashboard</span>
    </div>
    <h2>Bay 4 Report</h2>
    <p>Valley View is selected by default when available on your account.</p>
    <div id="login-error" class="login-error"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="">
    </div>
    <button class="btn-primary" id="signin-btn" onclick="doLogin()">Sign in</button>
    <p class="login-hint">Access restricted to authorized UNIS personnel</p>
  </div>
</div>

<!-- ═══════════════════════════════ DASHBOARD ═══════════════════════════════ -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <img src="https://unisco.sfo3.digitaloceanspaces.com/design-unisco-com/svg/unis-logo.svg" alt="UNIS">
      <div class="breadcrumb">Valley View / <span>Bay 4 Report</span></div>
    </div>
    <div class="topbar-right">
      <div class="date-pill" id="topbar-date">—</div>
      <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
      <button class="btn-signout" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="main-content">
    <!-- Date selector -->
    <div class="date-row">
      <label>Report date:</label>
      <input type="date" id="report-date">
      <button class="btn-load" onclick="loadData()">Load</button>
    </div>

    <!-- Summary cards -->
    <div class="summary-grid" id="summary-grid">
      <div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>
    </div>

    <!-- Customer breakdown table -->
    <div class="section-header">
      <h3>Bay 4 — Customer Breakdown</h3>
      <span class="tag" id="table-date-tag">—</span>
    </div>
    <div class="table-wrap" id="table-wrap">
      <div class="loading-state"><div class="spinner"></div><p>Fetching cycle count data…</p></div>
    </div>

    <hr class="section-divider">

    <!-- Open Tickets -->
    <div class="section-header">
      <h3>Count Tickets — Bay 4</h3>
      <span class="tag" id="ticket-count-tag">—</span>
    </div>
    <div id="ticket-list">
      <div class="loading-state"><div class="spinner"></div><p>Loading tickets…</p></div>
    </div>
  </div>
</div>

<script>
// ═══════════════ CONFIG ═══════════════
const AUTH_URL  = 'https://atlas.item.com/api/auth/password-grant';
const CC_BASE   = 'https://cyclecount.item.com';
const FACILITY_ID = 'LT_F1';
const TENANT_ID   = 'LT';

// Bay 4 racking: aisles 4103–4145; bulk: sections 19–24 slots 6–104
const BAY4_RACK_MIN = 4103;
const BAY4_RACK_MAX = 4145;
const BAY4_BULK_SECTIONS = [19,20,21,22,23,24];
const BAY4_BULK_SLOT_MIN = 6;
const BAY4_BULK_SLOT_MAX = 104;

let TOKEN = '';

// ═══════════════ AUTH ═══════════════
async function doLogin() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value;
  const btn  = document.getElementById('signin-btn');
  const err  = document.getElementById('login-error');
  if (!user || !pass) { showLoginError('Please enter username and password.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';
  err.style.display = 'none';

  try {
    const res = await fetch(AUTH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await res.json();
    const token = data?.data?.accessToken || data?.accessToken || data?.token;
    if (!token) throw new Error(data?.message || data?.error || 'Login failed');
    TOKEN = token;
    sessionStorage.setItem('vv_token', token);
    showDashboard();
  } catch(e) {
    showLoginError(e.message || 'Login failed. Check your credentials.');
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function signOut() {
  TOKEN = '';
  sessionStorage.removeItem('vv_token');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('signin-btn').disabled = false;
  document.getElementById('signin-btn').textContent = 'Sign in';
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

// ═══════════════ API HELPERS ═══════════════
function ccHeaders() {
  return {
    'Authorization': `Bearer ${TOKEN}`,
    'Content-Type': 'application/json',
    'x-tenant-id': TENANT_ID,
    'x-facility-id': FACILITY_ID,
    'x-channel': 'WEB',
    'item-screen-id': 'countTicket',
    'item-time-zone': 'America/Los_Angeles',
    'origin': 'https://cyclecount.item.com',
    'referer': 'https://cyclecount.item.com/cycle-count/count-ticket',
    'accept': 'application/json, text/plain, */*',
  };
}

async function ccPost(path, body) {
  const r = await fetch(`${CC_BASE}/api${path}`, {
    method: 'POST', headers: ccHeaders(), body: JSON.stringify(body)
  });
  if (!r.ok) { const t = await r.text(); throw new Error(`${path} → ${r.status}: ${t}`); }
  return r.json();
}

async function fetchAllPages(path, body) {
  let page = 1, all = [];
  while (true) {
    const data = await ccPost(path, { ...body, page, pageSize: 100 });
    const rows = data?.data?.list || data?.data?.content || data?.list || data?.content || [];
    all = all.concat(rows);
    const total = data?.data?.total ?? data?.total ?? rows.length;
    if (all.length >= total || rows.length === 0) break;
    page++;
  }
  return all;
}

// ═══════════════ DASHBOARD INIT ═══════════════
function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('report-date').value = today;
  loadData();
}

function getDateRange(dateStr) {
  const start = `${dateStr}T00:00:00.000Z`;
  const end   = `${dateStr}T23:59:59.999Z`;
  // Convert to LA time boundaries (UTC-7 or UTC-8)
  return { start, end };
}

async function loadData() {
  const dateStr = document.getElementById('report-date').value;
  if (!dateStr) return;
  document.getElementById('topbar-date').textContent = dateStr;
  document.getElementById('table-date-tag').textContent = dateStr;
  document.getElementById('ticket-count-tag').textContent = '…';

  // Reset UI
  document.getElementById('summary-grid').innerHTML = loadingHTML('Loading summary…');
  document.getElementById('table-wrap').innerHTML   = loadingHTML('Fetching cycle count data…');
  document.getElementById('ticket-list').innerHTML  = loadingHTML('Loading tickets…');

  try {
    const [tickets, results, customers] = await Promise.all([
      fetchTickets(dateStr),
      fetchResults(dateStr),
      fetchCustomers(),
    ]);
    renderAll(tickets, results, customers, dateStr);
  } catch(e) {
    const msg = `<div class="loading-state"><p>⚠ ${e.message}</p></div>`;
    document.getElementById('summary-grid').innerHTML = msg;
    document.getElementById('table-wrap').innerHTML   = msg;
    document.getElementById('ticket-list').innerHTML  = msg;
    console.error(e);
  }
}

// ═══════════════ DATA FETCHING ═══════════════
async function fetchTickets(dateStr) {
  // Fetch tickets created on this date; we'll filter to Bay 4 by location
  const body = {
    createdTimeFrom: `${dateStr}T00:00:00`,
    createdTimeTo:   `${dateStr}T23:59:59`,
  };
  const all = await fetchAllPages('/cyclecount-app/cycle-count/count-ticket/search-by-paging', body);
  return all;
}

async function fetchResults(dateStr) {
  const body = {
    createdTimeFrom: `${dateStr}T00:00:00`,
    createdTimeTo:   `${dateStr}T23:59:59`,
  };
  const all = await fetchAllPages('/cyclecount-app/cycle-count/count-result/search-by-paging', body);
  return all;
}

async function fetchCustomers() {
  try {
    const data = await ccPost('/cyclecount-bam/wms-bam/organization/search-by-paging', {
      page: 1, pageSize: 200, organizationType: 'CUSTOMER'
    });
    const list = data?.data?.list || data?.data?.content || data?.list || [];
    const map = {};
    list.forEach(c => { map[c.id] = c.name || c.organizationName || c.id; });
    return map;
  } catch(e) {
    console.warn('Could not load customers:', e.message);
    return {};
  }
}

// ═══════════════ BAY 4 DETECTION ═══════════════
function isBay4Location(locCode) {
  if (!locCode) return false;
  const parts = locCode.split('.');
  if (parts.length < 2) return false;
  const section = parseInt(parts[0]);
  // Racking: section 4103–4145
  if (parts.length >= 4 && section >= BAY4_RACK_MIN && section <= BAY4_RACK_MAX) return true;
  // Bulk: sections 19–24, slot 6–104
  if (parts.length === 2 && BAY4_BULK_SECTIONS.includes(section)) {
    const slot = parseInt(parts[1]);
    if (slot >= BAY4_BULK_SLOT_MIN && slot <= BAY4_BULK_SLOT_MAX) return true;
  }
  return false;
}

function locationType(locCode) {
  if (!locCode) return 'UNKNOWN';
  const parts = locCode.split('.');
  const section = parseInt(parts[0]);
  if (parts.length >= 4 && section >= BAY4_RACK_MIN && section <= BAY4_RACK_MAX) return 'RACKING';
  return 'BULK';
}

// ═══════════════ RENDER ═══════════════
function renderAll(tickets, results, customerMap, dateStr) {
  // Filter results to Bay 4
  const bay4Results = results.filter(r => {
    const loc = r.locationCode || r.location?.code || r.location || '';
    return isBay4Location(loc);
  });

  // Also filter tickets: a ticket is "Bay 4" if any of its results are Bay 4
  const bay4TicketIds = new Set(bay4Results.map(r => r.countTicketId || r.ticketId));
  const bay4Tickets   = tickets.filter(t => bay4TicketIds.has(t.id));

  // Aggregate by customer
  const byCustomer = {};
  bay4Results.forEach(r => {
    const cid   = r.customerId || r.customer?.id || 'UNKNOWN';
    const cname = customerMap[cid] || r.customerName || r.customer?.name || cid;
    const loc   = r.locationCode || r.location?.code || r.location || '';
    const ltype = locationType(loc);
    const key   = cid;
    if (!byCustomer[key]) {
      byCustomer[key] = { id: cid, name: cname, total: 0, accurate: 0, variances: 0, racking: 0, bulk: 0 };
    }
    byCustomer[key].total++;
    // Accuracy: countedQty === expectedQty (exact match)
    const counted  = r.countedQuantity  ?? r.countedQty  ?? r.qty ?? null;
    const expected = r.expectedQuantity ?? r.expectedQty ?? r.systemQty ?? null;
    if (counted !== null && expected !== null) {
      if (counted === expected) byCustomer[key].accurate++;
      else byCustomer[key].variances++;
    }
    if (ltype === 'RACKING') byCustomer[key].racking++;
    else byCustomer[key].bulk++;
  });

  const rows = Object.values(byCustomer).sort((a,b) => b.total - a.total);

  // Summary totals
  const totalLocations = bay4Results.length;
  const totalAccurate  = rows.reduce((s,r) => s + r.accurate, 0);
  const totalVariances = rows.reduce((s,r) => s + r.variances, 0);
  const accuracy       = totalLocations > 0 ? Math.round((totalAccurate / totalLocations) * 100) : 0;

  renderSummary(totalLocations, totalAccurate, totalVariances, accuracy, bay4Tickets.length);
  renderTable(rows, totalLocations, totalAccurate, totalVariances);
  renderTickets(bay4Tickets, customerMap);
  document.getElementById('ticket-count-tag').textContent = `${bay4Tickets.length} ticket${bay4Tickets.length !== 1 ? 's' : ''}`;
}

function renderSummary(total, accurate, variances, accuracy, ticketCount) {
  const color = accuracy >= 95 ? 'green' : accuracy >= 85 ? 'yellow' : 'red';
  document.getElementById('summary-grid').innerHTML = `
    <div class="summary-card">
      <div class="sc-label">Locations Counted</div>
      <div class="sc-val">${total.toLocaleString()}</div>
      <div class="sc-sub">Bay 4</div>
    </div>
    <div class="summary-card ${color}">
      <div class="sc-label">Accuracy</div>
      <div class="sc-val">${accuracy}%</div>
      <div class="sc-sub">${accurate.toLocaleString()} exact matches</div>
    </div>
    <div class="summary-card ${variances > 0 ? 'red' : ''}">
      <div class="sc-label">Variances</div>
      <div class="sc-val">${variances.toLocaleString()}</div>
      <div class="sc-sub">locations with discrepancy</div>
    </div>
    <div class="summary-card">
      <div class="sc-label">Tickets</div>
      <div class="sc-val">${ticketCount}</div>
      <div class="sc-sub">count tickets today</div>
    </div>
  `;
}

function renderTable(rows, totalLoc, totalAcc, totalVar) {
  if (!rows.length) {
    document.getElementById('table-wrap').innerHTML = `<div class="empty-state"><p>No Bay 4 cycle count data found for this date.</p></div>`;
    return;
  }

  const rowsHtml = rows.map(r => {
    const pct = r.total > 0 ? Math.round((r.accurate / r.total) * 100) : 0;
    const color = pct >= 95 ? 'var(--green)' : pct >= 85 ? 'var(--yellow)' : 'var(--red)';
    return `<tr>
      <td>
        <div class="customer-name">${esc(r.name)}</div>
        <div class="location-type">
          ${r.racking > 0 ? `RACK: ${r.racking}` : ''}
          ${r.racking > 0 && r.bulk > 0 ? ' · ' : ''}
          ${r.bulk > 0 ? `BULK: ${r.bulk}` : ''}
        </div>
      </td>
      <td>${r.total.toLocaleString()}</td>
      <td>${r.accurate.toLocaleString()}</td>
      <td>${r.variances > 0 ? `<span style="color:var(--red)">${r.variances.toLocaleString()}</span>` : '—'}</td>
      <td>
        <div class="acc-cell">
          <div class="acc-bar-wrap"><div class="acc-bar" style="width:${pct}%;background:${color}"></div></div>
          <span class="acc-num" style="color:${color}">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  const totalPct = totalLoc > 0 ? Math.round((totalAcc / totalLoc) * 100) : 0;

  document.getElementById('table-wrap').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Customer</th>
          <th>Locations</th>
          <th>Accurate</th>
          <th>Variances</th>
          <th>Accuracy</th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml}
        <tr class="totals-row">
          <td>TOTAL — Bay 4</td>
          <td>${totalLoc.toLocaleString()}</td>
          <td>${totalAcc.toLocaleString()}</td>
          <td>${totalVar > 0 ? totalVar.toLocaleString() : '—'}</td>
          <td><span style="font-family:var(--mono)">${totalPct}%</span></td>
        </tr>
      </tbody>
    </table>
  `;
}

function renderTickets(tickets, customerMap) {
  if (!tickets.length) {
    document.getElementById('ticket-list').innerHTML = `<div class="empty-state"><p>No Bay 4 tickets found for this date.</p></div>`;
    return;
  }

  const sorted = [...tickets].sort((a,b) => {
    const order = { COMPLETED:0, IN_PROGRESS:1, OPEN:2, CANCELLED:3 };
    return (order[a.status]??9) - (order[b.status]??9);
  });

  const cards = sorted.map(t => {
    const status    = t.status || 'UNKNOWN';
    const statusCls = 'status-' + status.toLowerCase().replace(/ /g,'_');
    const cid       = t.customerId || t.customer?.id;
    const cname     = customerMap[cid] || t.customerName || t.customer?.name || cid || '—';
    const ticketNo  = t.ticketNo || t.countTicketNo || t.no || t.id || '—';
    const created   = t.createdTime ? t.createdTime.slice(0,16).replace('T',' ') : '—';
    const type      = t.countType || t.type || '—';
    const method    = t.countMethod || t.method || '—';

    return `<div class="ticket-card">
      <div class="ticket-top">
        <span class="ticket-id">${esc(String(ticketNo))}</span>
        <span class="ticket-status-pill ${statusCls}">${status.replace(/_/g,' ')}</span>
      </div>
      <div class="ticket-meta">
        <div class="ticket-meta-item">
          <span class="ticket-meta-label">Customer</span>
          <span class="ticket-meta-val">${esc(String(cname))}</span>
        </div>
        <div class="ticket-meta-item">
          <span class="ticket-meta-label">Created</span>
          <span class="ticket-meta-val">${created}</span>
        </div>
        <div class="ticket-meta-item">
          <span class="ticket-meta-label">Type</span>
          <span class="ticket-meta-val">${esc(String(type))}</span>
        </div>
        <div class="ticket-meta-item">
          <span class="ticket-meta-label">Method</span>
          <span class="ticket-meta-val">${esc(String(method))}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('ticket-list').innerHTML = `<div class="ticket-grid">${cards}</div>`;
}

// ═══════════════ UTILITIES ═══════════════
function loadingHTML(msg) {
  return `<div class="loading-state"><div class="spinner"></div><p>${msg}</p></div>`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════ ENTER KEY + SESSION ═══════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') {
    doLogin();
  }
});

// Restore session if token still cached
const cached = sessionStorage.getItem('vv_token');
if (cached) { TOKEN = cached; showDashboard(); }
</script>
